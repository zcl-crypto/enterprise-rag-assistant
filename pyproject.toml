[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Enterprise knowledge base RAG portfolio project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5", "Pillow>=10,<13"]
parsing = ["docling>=2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
retrieval = ["qdrant-client>=1.17,<2", "sentence-transformers>=3,<6", "fastembed>=0.8,<1", "jieba>=0.42,<1"]
model-download = ["modelscope>=1.40,<2"]
generation = ["openai>=1.0,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_app*"]
